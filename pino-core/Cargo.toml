[package]
name = "pino-core"
version = "0.1.0"
edition = "2021"
authors = ["pino-rs contributors"]
description = "Core logging library for pino-rs"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
hostname = "0.4"
crossbeam-channel = "0.5"
itoa = "1.0"
ryu = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
