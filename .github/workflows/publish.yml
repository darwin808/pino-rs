name: Publish to npm

on:
  push:
    tags:
      - 'v*'

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin

          # Linux GNU (glibc)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              npm run build -- --target aarch64-unknown-linux-gnu

          # Linux musl (Alpine)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              npm run build -- --target x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: |
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
              npm run build -- --target aarch64-unknown-linux-musl

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: cd pino-node && npm install

      - name: Build
        run: cd pino-node && ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: pino-node/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: cd pino-node && npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: pino-node/artifacts

      - name: List artifacts
        run: ls -R pino-node/artifacts

      - name: Move artifacts to npm packages
        run: |
          cd pino-node

          # Move each artifact to its npm package directory
          # macOS
          cp artifacts/bindings-x86_64-apple-darwin/*.node npm/darwin-x64/ 2>/dev/null || true
          cp artifacts/bindings-aarch64-apple-darwin/*.node npm/darwin-arm64/ 2>/dev/null || true

          # Linux GNU
          cp artifacts/bindings-x86_64-unknown-linux-gnu/*.node npm/linux-x64-gnu/ 2>/dev/null || true
          cp artifacts/bindings-aarch64-unknown-linux-gnu/*.node npm/linux-arm64-gnu/ 2>/dev/null || true

          # Linux musl
          cp artifacts/bindings-x86_64-unknown-linux-musl/*.node npm/linux-x64-musl/ 2>/dev/null || true
          cp artifacts/bindings-aarch64-unknown-linux-musl/*.node npm/linux-arm64-musl/ 2>/dev/null || true

          # Windows
          cp artifacts/bindings-x86_64-pc-windows-msvc/*.node npm/win32-x64-msvc/ 2>/dev/null || true

          # List what we have
          echo "=== npm packages contents ==="
          ls -la npm/*/

      - name: Publish darwin-x64
        run: |
          cd pino-node/npm/darwin-x64
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish darwin-arm64
        run: |
          cd pino-node/npm/darwin-arm64
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-x64-gnu
        run: |
          cd pino-node/npm/linux-x64-gnu
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-arm64-gnu
        run: |
          cd pino-node/npm/linux-arm64-gnu
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-x64-musl
        run: |
          cd pino-node/npm/linux-x64-musl
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-arm64-musl
        run: |
          cd pino-node/npm/linux-arm64-musl
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish win32-x64-msvc
        run: |
          cd pino-node/npm/win32-x64-msvc
          if [ -f *.node ]; then
            npm publish --access public || echo "Already published or failed"
          else
            echo "No .node file, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: cd pino-node && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
